<svg xmlns="http://www.w3.org/2000/svg"
width="820"
height="260"
viewBox="0 0 820 260">

<defs>

  <linearGradient id="bg"
    x1="0%" y1="0%"
    x2="100%" y2="100%">

    <stop offset="0%"
      stop-color="#161b22"/>

    <stop offset="100%"
      stop-color="#0d1117"/>

  </linearGradient>

  <linearGradient id="accent"
    x1="0%" y1="0%"
    x2="100%" y2="0%">

    <stop offset="0%"
      stop-color="#58a6ff"/>

    <stop offset="100%"
      stop-color="#a371f7"/>

  </linearGradient>

  <filter id="shadow">
    <feDropShadow
      dx="0"
      dy="8"
      stdDeviation="12"
      flood-opacity="0.35"/>
  </filter>

</defs>

<!-- Main Card -->

<rect
  x="2"
  y="2"
  width="816"
  height="256"
  rx="20"
  fill="url(#bg)"
  stroke="#30363d"
  stroke-width="1"
  filter="url(#shadow)"
/>

<!-- Accent -->

<rect
  x="2"
  y="2"
  width="816"
  height="5"
  rx="3"
  fill="url(#accent)"
/>

<!-- Header -->

<text
  x="35"
  y="48"
  fill="#f0f6fc"
  font-size="23"
  font-family="Arial, sans-serif"
  font-weight="bold">

  GitHub Overview

</text>

<text
  x="35"
  y="75"
  fill="#8b949e"
  font-size="13"
  font-family="Arial, sans-serif">

  @Mystifying7 • Developer Activity

</text>


<!-- Divider -->

<line
  x1="35"
  y1="95"
  x2="785"
  y2="95"
  stroke="#21262d"
/>


<!-- Metric Card 1 -->

<rect
  x="35"
  y="115"
  width="230"
  height="105"
  rx="14"
