name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1. Checkout
      # ---------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ---------------------------------------
      # 2. Setup Python
      # ---------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------------------------------
      # 3. Prepare Directory
      # ---------------------------------------
      - name: Prepare Stats Directory
        run: |
          mkdir -p generated-stats

      # ---------------------------------------
      # 4. Generate Premium GitHub Stats
      # ---------------------------------------
      - name: Generate GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import os
          from pathlib import Path

          username = "Mystifying7"

          url = f"https://api.github.com/users/{username}"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          repos = data.get("public_repos", 0)
          followers = data.get("followers", 0)
          following = data.get("following", 0)

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="820"
          height="260"
          viewBox="0 0 820 260">

          <rect width="820" height="260" rx="20" fill="#0d1117"/>

          <rect
            x="1"
            y="1"
            width="818"
            height="258"
            rx="20"
            fill="none"
            stroke="#30363d"
            stroke-width="2"/>

          <text
            x="40"
            y="55"
            fill="#58a6ff"
            font-size="28"
            font-family="Arial, sans-serif"
            font-weight="bold">
            GitHub Stats
          </text>

          <text
            x="40"
            y="82"
            fill="#8b949e"
            font-size="14"
            font-family="Arial, sans-serif">
            @{username}
          </text>

          <line
            x1="40"
            y1="105"
            x2="780"
            y2="105"
            stroke="#30363d"
            stroke-width="1"/>

          <rect
            x="40"
            y="130"
            width="220"
            height="85"
            rx="12"
            fill="#161b22"/>

          <text
            x="60"
            y="160"
            fill="#8b949e"
            font-size="12"
            font-family="Arial, sans-serif">
            PUBLIC REPOSITORIES
          </text>

          <text
            x="60"
            y="195"
            fill="#58a6ff"
            font-size="28"
            font-family="Arial, sans-serif"
            font-weight="bold">
            {repos}
          </text>


          <rect
            x="300"
            y="130"
            width="220"
            height="85"
            rx="12"
            fill="#161b22"/>

          <text
            x="320"
            y="160"
            fill="#8b949e"
            font-size="12"
            font-family="Arial, sans-serif">
            FOLLOWERS
          </text>

          <text
            x="320"
            y="195"
            fill="#a371f7"
            font-size="28"
            font-family="Arial, sans-serif"
            font-weight="bold">
            {followers}
          </text>


          <rect
            x="560"
            y="130"
            width="220"
            height="85"
            rx="12"
            fill="#161b22"/>

          <text
            x="580"
            y="160"
            fill="#8b949e"
            font-size="12"
            font-family="Arial, sans-serif">
            FOLLOWING
          </text>

          <text
            x="580"
            y="195"
            fill="#3fb950"
            font-size="28"
            font-family="Arial, sans-serif"
            font-weight="bold">
            {following}
          </text>

          </svg>"""

          Path("generated-stats/github-stats.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print("GitHub Stats SVG generated successfully.")
          PY


      # ---------------------------------------
      # 5. Generate Top Languages
      # ---------------------------------------
      - name: Generate Top Languages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import os
          from pathlib import Path

          username = "Mystifying7"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          repos_url = (
              f"https://api.github.com/users/"
              f"{username}/repos?per_page=100"
          )

          request = urllib.request.Request(
              repos_url,
              headers=headers
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          languages = {}

          for repo in repos:

              if repo.get("fork"):
                  continue

              lang_url = repo.get("languages_url")

              if not lang_url:
                  continue

              try:

                  request = urllib.request.Request(
                      lang_url,
                      headers=headers
                  )

                  with urllib.request.urlopen(request) as response:
                      repo_languages = json.load(response)

                  for language, value in repo_languages.items():

                      languages[language] = (
                          languages.get(language, 0)
                          + value
                      )

              except Exception:
                  continue


          languages = sorted(
              languages.items(),
              key=lambda x: x[1],
              reverse=True
          )[:6]


          total = sum(
              value
              for _, value in languages
          )


          # Language colors

          colors = {
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "Python": "#3572A5",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "Java": "#b07219",
              "C++": "#f34b7d",
              "C": "#555555",
              "Jupyter Notebook": "#DA5B0B",
              "Shell": "#89e051"
          }


          svg = '''
          <svg xmlns="http://www.w3.org/2000/svg"
          width="820"
          height="350"
          viewBox="0 0 820 350">

          <defs>

            <linearGradient id="langbg"
              x1="0%" y1="0%"
              x2="100%" y2="100%">

              <stop offset="0%"
                stop-color="#161b22"/>

              <stop offset="100%"
                stop-color="#0d1117"/>

            </linearGradient>

          </defs>


          <rect
            x="2"
            y="2"
            width="816"
            height="346"
            rx="20"
            fill="url(#langbg)"
            stroke="#30363d"
          />


          <text
            x="35"
            y="48"
            fill="#f0f6fc"
            font-size="23"
            font-family="Arial"
            font-weight="bold">

            Most Used Languages

          </text>


          <text
            x="35"
            y="75"
            fill="#8b949e"
            font-size="13"
            font-family="Arial">

            Based on code distribution across public repositories

          </text>

          <line
            x1="35"
            y1="95"
            x2="785"
            y2="95"
            stroke="#21262d"
          />

          '''

          y = 125

          for language, value in languages:

              percentage = (
                  value / total * 100
                  if total > 0
                  else 0
              )

              color = colors.get(
                  language,
                  "#58a6ff"
              )

              bar_width = 500

              filled = (
                  bar_width
                  * percentage
                  / 100
              )

              svg += f'''

              <circle
                cx="45"
                cy="{y - 5}"
                r="6"
                fill="{color}"
              />

              <text
                x="65"
                y="{y}"
                fill="#f0f6fc"
                font-size="14"
                font-family="Arial">

                {language}

              </text>


              <text
                x="760"
                y="{y}"
                text-anchor="end"
                fill="#8b949e"
                font-size="13"
                font-family="Arial">

                {percentage:.1f}%

              </text>


              <rect
                x="65"
                y="{y + 12}"
                width="{bar_width}"
                height="7"
                rx="4"
                fill="#21262d"
              />


              <rect
                x="65"
                y="{y + 12}"
                width="{filled}"
                height="7"
                rx="4"
                fill="{color}"
              />

              '''

              y += 36


          svg += '''

          <text
            x="65"
            y="330"
            fill="#6e7681"
            font-size="10"
            font-family="Arial">

            github.com/Mystifying7

          </text>

          </svg>

          '''


          Path(
              "generated-stats/top-languages.svg"
          ).write_text(svg)

          print("Premium language stats generated.")
          PY


      # ---------------------------------------
            # ---------------------------------------
      # 6. Generate Contribution Overview
      # ---------------------------------------
      - name: Generate Contribution Overview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import os
          from pathlib import Path
          from datetime import date, timedelta

          username = "Mystifying7"

          # ---------------------------------------
          # Get GitHub Contribution Calendar
          # ---------------------------------------

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise Exception(
                  "GitHub GraphQL Error: "
                  + json.dumps(result["errors"])
              )

          calendar = (
              result["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total_contributions = calendar["totalContributions"]

          # ---------------------------------------
          # Flatten Contribution Days
          # ---------------------------------------

          days = []

          for week in calendar["weeks"]:
              for contribution_day in week["contributionDays"]:
                  days.append({
                      "date": contribution_day["date"],
                      "count": contribution_day["contributionCount"]
                  })

          days.sort(
              key=lambda x: x["date"]
          )

          # ---------------------------------------
          # Calculate Current Streak
          # ---------------------------------------

          current_streak = 0

          if days:

              today = date.today()

              # GitHub data may be in UTC.
              # Start from latest available day.
              latest_day = date.fromisoformat(
                  days[-1]["date"]
              )

              # If latest day is today,
              # start checking from today.
              # Otherwise start from latest day.
              check_date = latest_day

              day_map = {
                  date.fromisoformat(
                      item["date"]
                  ): item["count"]
                  for item in days
              }

              # If today has no contribution yet,
              # current streak can start from yesterday.
              if (
                  check_date == today
                  and day_map.get(
                      check_date,
                      0
                  ) == 0
              ):
                  check_date -= timedelta(
                      days=1
                  )

              while (
                  check_date in day_map
                  and day_map[check_date] > 0
              ):
                  current_streak += 1

                  check_date -= timedelta(
                      days=1
                  )

          # ---------------------------------------
          # Calculate Longest Streak
          # ---------------------------------------

          longest_streak = 0
          running_streak = 0

          for item in days:

              if item["count"] > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:

                  running_streak = 0

          # ---------------------------------------
          # Calculate Date Range
          # ---------------------------------------

          if days:

              start_date = days[0]["date"]
              end_date = days[-1]["date"]

              start_obj = date.fromisoformat(
                  start_date
              )

              end_obj = date.fromisoformat(
                  end_date
              )

              start_label = start_obj.strftime(
                  "%b %d"
              )

              if end_obj == date.today():

                  end_label = "Present"

              else:

                  end_label = end_obj.strftime(
                      "%b %d"
                  )

              date_range = (
                  f"{start_label} - {end_label}"
              )

          else:

              date_range = "No contribution data"

          # ---------------------------------------
          # Generate Premium SVG
          # ---------------------------------------

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="820"
          height="270"
          viewBox="0 0 820 270">

          <defs>

            <linearGradient
              id="overviewBg"
              x1="0%"
              y1="0%"
              x2="100%"
              y2="100%">

              <stop
                offset="0%"
                stop-color="#0d1117"/>

              <stop
                offset="100%"
                stop-color="#161b22"/>

            </linearGradient>

            <linearGradient
              id="blueGlow"
              x1="0%"
              y1="0%"
              x2="100%"
              y2="0%">

              <stop
                offset="0%"
                stop-color="#00d4ff"/>

              <stop
                offset="100%"
                stop-color="#58a6ff"/>

            </linearGradient>

          </defs>


          <!-- Main Card -->

          <rect
            x="2"
            y="2"
            width="816"
            height="266"
            rx="20"
            fill="url(#overviewBg)"
            stroke="#1f6feb"
            stroke-width="1.5"
          />


          <!-- Header -->

          <text
            x="35"
            y="42"
            fill="#f0f6fc"
            font-size="21"
            font-family="Arial, sans-serif"
            font-weight="bold">

            GitHub Contribution Overview

          </text>


          <text
            x="35"
            y="67"
            fill="#8b949e"
            font-size="12"
            font-family="Arial, sans-serif">

            @{username}

          </text>


          <line
            x1="35"
            y1="88"
            x2="785"
            y2="88"
            stroke="#21262d"
            stroke-width="1"
          />


          <!-- Total Contributions -->

          <rect
            x="35"
            y="110"
            width="225"
            height="105"
            rx="14"
            fill="#0d1117"
            stroke="#21262d"
          />

          <text
            x="58"
            y="142"
            fill="#8b949e"
            font-size="11"
            font-family="Arial, sans-serif">

            TOTAL CONTRIBUTIONS

          </text>

          <text
            x="58"
            y="182"
            fill="#58a6ff"
            font-size="30"
            font-family="Arial, sans-serif"
            font-weight="bold">

            {total_contributions}

          </text>

          <text
            x="58"
            y="202"
            fill="#6e7681"
            font-size="10"
            font-family="Arial, sans-serif">

            {date_range}

          </text>


          <!-- Divider -->

          <line
            x1="275"
            y1="112"
            x2="275"
            y2="213"
            stroke="#00d4ff"
            stroke-opacity="0.35"
          />


          <!-- Current Streak -->

          <rect
            x="297"
            y="110"
            width="225"
            height="105"
            rx="14"
            fill="#0d1117"
            stroke="#21262d"
          />

          <text
            x="320"
            y="142"
            fill="#8b949e"
            font-size="11"
            font-family="Arial, sans-serif">

            CURRENT STREAK

          </text>

          <text
            x="320"
            y="182"
            fill="#00d4ff"
            font-size="30"
            font-family="Arial, sans-serif"
            font-weight="bold">

            {current_streak}

          </text>

          <text
            x="320"
            y="202"
            fill="#6e7681"
            font-size="10"
            font-family="Arial, sans-serif">

            consecutive active days

          </text>


          <!-- Divider -->

          <line
            x1="537"
            y1="112"
            x2="537"
            y2="213"
            stroke="#00d4ff"
            stroke-opacity="0.35"
          />


          <!-- Longest Streak -->

          <rect
            x="559"
            y="110"
            width="225"
            height="105"
            rx="14"
            fill="#0d1117"
            stroke="#21262d"
          />

          <text
            x="582"
            y="142"
            fill="#8b949e"
            font-size="11"
            font-family="Arial, sans-serif">

            LONGEST STREAK

          </text>

          <text
            x="582"
            y="182"
            fill="#a371f7"
            font-size="30"
            font-family="Arial, sans-serif"
            font-weight="bold">

            {longest_streak}

          </text>

          <text
            x="582"
            y="202"
            fill="#6e7681"
            font-size="10"
            font-family="Arial, sans-serif">

            best contribution streak

          </text>


          <!-- Footer -->

          <text
            x="35"
            y="245"
            fill="#6e7681"
            font-size="10"
            font-family="Arial, sans-serif">

            github.com/{username}

          </text>


          <circle
            cx="770"
            cy="242"
            r="5"
            fill="#3fb950"
          />

          <text
            x="755"
            y="245"
            text-anchor="end"
            fill="#8b949e"
            font-size="10"
            font-family="Arial, sans-serif">

            LIVE DATA

          </text>

          </svg>'''

          Path(
              "generated-stats/streak.svg"
          ).write_text(
              svg,
              encoding="utf-8"
          )

          print(
              "GitHub Contribution Overview generated."
          )

          print(
              f"Total Contributions: "
              f"{total_contributions}"
          )

          print(
              f"Current Streak: "
              f"{current_streak}"
          )

          print(
              f"Longest Streak: "
              f"{longest_streak}"
          )

          PY


      # ---------------------------------------
      # 7. Commit Generated SVGs
      # ---------------------------------------
      - name: Commit Updated Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated-stats/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"

          git pull --rebase origin main

          git push origin HEAD:main

      