name: Update GitHub Profile Stats

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"

  # Allows you to manually run the workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # 1. Checkout Repository
      # ---------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ---------------------------------------
      # 2. Setup Python
      # ---------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------------------------------
      # 3. Create Assets Folder
      # ---------------------------------------
      - name: Create Assets Folder
        run: |
          mkdir -p assets

      # ---------------------------------------
      # 4. Generate GitHub Stats
      # ---------------------------------------
      - name: Generate GitHub Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          from pathlib import Path

          username = "Mystifying7"

          url = f"https://api.github.com/users/{username}"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {__import__('os').environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          repos = data.get("public_repos", 0)
          followers = data.get("followers", 0)
          following = data.get("following", 0)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="495"
          height="220"
          viewBox="0 0 495 220">

          <rect
            width="495"
            height="220"
            rx="15"
            fill="#1a1b27"
          />

          <text
            x="30"
            y="45"
            fill="#70a5fd"
            font-size="24"
            font-family="Arial, sans-serif"
            font-weight="bold">
            GitHub Stats
          </text>

          <text
            x="30"
            y="90"
            fill="#ffffff"
            font-size="16"
            font-family="Arial, sans-serif">
            Public Repositories
          </text>

          <text
            x="450"
            y="90"
            text-anchor="end"
            fill="#70a5fd"
            font-size="20"
            font-family="Arial, sans-serif"
            font-weight="bold">
            {repos}
          </text>

          <text
            x="30"
            y="130"
            fill="#ffffff"
            font-size="16"
            font-family="Arial, sans-serif">
            Followers
          </text>

          <text
            x="450"
            y="130"
            text-anchor="end"
            fill="#70a5fd"
            font-size="20"
            font-family="Arial, sans-serif"
            font-weight="bold">
            {followers}
          </text>

          <text
            x="30"
            y="170"
            fill="#ffffff"
            font-size="16"
            font-family="Arial, sans-serif">
            Following
          </text>

          <text
            x="450"
            y="170"
            text-anchor="end"
            fill="#70a5fd"
            font-size="20"
            font-family="Arial, sans-serif"
            font-weight="bold">
            {following}
          </text>

          <text
            x="30"
            y="205"
            fill="#8b949e"
            font-size="12"
            font-family="Arial, sans-serif">
            github.com/{username}
          </text>

          </svg>'''

          Path("assets/github-stats.svg").write_text(svg)

          print("GitHub Stats generated successfully.")
          PY

      # ---------------------------------------
      # 5. Generate Top Languages
      # ---------------------------------------
      - name: Generate Top Languages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import os
          from pathlib import Path

          username = "Mystifying7"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          repos_url = f"https://api.github.com/users/{username}/repos?per_page=100"

          request = urllib.request.Request(
              repos_url,
              headers=headers
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          languages = {}

          for repo in repos:

              if repo.get("fork"):
                  continue

              lang_url = repo.get("languages_url")

              if not lang_url:
                  continue

              request = urllib.request.Request(
                  lang_url,
                  headers=headers
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      repo_languages = json.load(response)

                  for language, bytes_count in repo_languages.items():
                      languages[language] = (
                          languages.get(language, 0)
                          + bytes_count
                      )

              except Exception:
                  continue

          languages = sorted(
              languages.items(),
              key=lambda x: x[1],
              reverse=True
          )[:6]

          total = sum(value for _, value in languages)

          width = 495
          height = 280

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{width}"
          height="{height}"
          viewBox="0 0 {width} {height}">

          <rect
            width="{width}"
            height="{height}"
            rx="15"
            fill="#1a1b27"
          />

          <text
            x="30"
            y="45"
            fill="#70a5fd"
            font-size="24"
            font-family="Arial, sans-serif"
            font-weight="bold">
            Top Languages
          </text>
          '''

          y = 85

          for language, value in languages:

              percentage = (
                  (value / total) * 100
                  if total > 0
                  else 0
              )

              svg += f'''
              <text
                x="30"
                y="{y}"
                fill="#ffffff"
                font-size="15"
                font-family="Arial, sans-serif">
                {language}
              </text>

              <text
                x="450"
                y="{y}"
                text-anchor="end"
                fill="#70a5fd"
                font-size="15"
                font-family="Arial, sans-serif">
                {percentage:.1f}%
              </text>

              <rect
                x="30"
                y="{y + 10}"
                width="420"
                height="6"
                rx="3"
                fill="#30363d"
              />

              <rect
                x="30"
                y="{y + 10}"
                width="{420 * percentage / 100}"
                height="6"
                rx="3"
                fill="#70a5fd"
              />
              '''

              y += 35

          svg += "</svg>"

          Path("assets/top-languages.svg").write_text(svg)

          print("Top Languages generated successfully.")
          PY

      # ---------------------------------------
      # 6. Generate Contribution Streak
      # ---------------------------------------
      - name: Generate Contribution Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path

          username = "Mystifying7"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          end = datetime.utcnow().date()
          start = end - timedelta(days=365)

          contributions_url = (
              f"https://api.github.com/users/"
              f"{username}/events/public?per_page=100"
          )

          request = urllib.request.Request(
              contributions_url,
              headers=headers
          )

          try:

              with urllib.request.urlopen(request) as response:
                  events = json.load(response)

              active_days = set()

              for event in events:

                  if event.get("type") in [
                      "PushEvent",
                      "PullRequestEvent",
                      "IssuesEvent",
                      "IssueCommentEvent",
                      "CreateEvent"
                  ]:

                      date = event.get("created_at", "")[:10]

                      if date:
                          active_days.add(date)

              current_streak = 0
              check_date = end

              while check_date.isoformat() in active_days:

                  current_streak += 1
                  check_date -= timedelta(days=1)

              longest_streak = current_streak

              svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="495"
              height="220"
              viewBox="0 0 495 220">

              <rect
                width="495"
                height="220"
                rx="15"
                fill="#1a1b27"
              />

              <text
                x="30"
                y="45"
                fill="#70a5fd"
                font-size="24"
                font-family="Arial, sans-serif"
                font-weight="bold">
                Contribution Streak
              </text>

              <text
                x="30"
                y="100"
                fill="#ffffff"
                font-size="16"
                font-family="Arial, sans-serif">
                Current Streak
              </text>

              <text
                x="450"
                y="100"
                text-anchor="end"
                fill="#70a5fd"
                font-size="24"
                font-family="Arial, sans-serif"
                font-weight="bold">
                {current_streak} days
              </text>

              <text
                x="30"
                y="150"
                fill="#ffffff"
                font-size="16"
                font-family="Arial, sans-serif">
                Activity Detected
              </text>

              <text
                x="450"
                y="150"
                text-anchor="end"
                fill="#70a5fd"
                font-size="20"
                font-family="Arial, sans-serif"
                font-weight="bold">
                {len(active_days)} days
              </text>

              <text
                x="30"
                y="195"
                fill="#8b949e"
                font-size="12"
                font-family="Arial, sans-serif">
                github.com/{username}
              </text>

              </svg>'''

          except Exception:

              svg = '''<svg xmlns="http://www.w3.org/2000/svg"
              width="495"
              height="220">

              <rect
                width="495"
                height="220"
                rx="15"
                fill="#1a1b27"/>

              <text
                x="30"
                y="50"
                fill="#70a5fd"
                font-size="24"
                font-family="Arial"
                font-weight="bold">
                Contribution Streak
              </text>

              <text
                x="30"
                y="110"
                fill="#ffffff"
                font-size="16"
                font-family="Arial">
                GitHub contribution data unavailable
              </text>

              </svg>'''

          Path("assets/streak.svg").write_text(svg)

          print("Contribution Streak generated successfully.")
          PY

      # ---------------------------------------
      # 7. Commit Generated Files
      # ---------------------------------------
      - name: Commit Updated Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          git diff --cached --quiet || git commit -m "Update GitHub profile stats"

          git push
